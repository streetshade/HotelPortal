<title>Metropolitan Project Studio</title>
<meta name="description" content="Clickable prototype of Metropolitan's project selection space for hotel chains and developers, themed per customer and per project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,800;1,800&family=Jost:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:wght@600&family=Playfair+Display:wght@600&family=Josefin+Sans:wght@600&display=swap">
<style>
/* Layout: onyx top bar (the box lid) · inside a customer space the whole page sits on a split background:
   customer brand on the left fading into Metropolitan on the right along a line 25° off vertical ·
   content floats on white "information card" panels with onyx title bands · copper footer band (the deck). */
:root {
  /* Metropolitan base: box & book + presentation deck */
  --onyx: #111110;        /* matte box black, fixed in both themes */
  --onyx-2: #1C1B19;
  --onyx-ink: #F1ECE3;
  --onyx-muted: #9C958A;
  --copper: #B77729;      /* foil + deck band */
  --copper-deep: #9E6421; /* band behind white text (4.9:1) */
  --ground: #F4F3F1;
  --surface: #FFFFFF;
  --sunk: #ECEAE6;
  --ink: #141414;
  --muted: #67625A;
  --line: #E0DCD5;
  --copper-text: #8A5617;
  --accent: #141414;      /* controls: black buttons, copper on hover */
  --accent-ink: #FFFFFF;
  --focus: #B77729;
  --st-approved: #2A7049;  --st-approved-bg: #E2F0E7;
  --st-review: #8F5B06;    --st-review-bg: #F7ECD6;
  --st-revise: #A53D28;    --st-revise-bg: #F7E3DE;
  --st-proposed: #3F5B7C;  --st-proposed-bg: #E3EAF2;
  --st-muted: #5B5850;     --st-muted-bg: #E9E6E0;
  --shadow: 0 1px 2px rgba(17,17,16,.06), 0 10px 30px rgba(17,17,16,.12);
  --scrim: rgba(12,12,11,.5);
  --tilt: 115deg;         /* gradient direction; 90deg + 25° puts the seam 25° off vertical */
  --f-sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mark: "Jost", "Futura", "Century Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 2px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0D0D0C; --surface: #171614; --sunk: #1F1E1B; --ink: #EEEAE3; --muted: #A39C90; --line: #2E2C28;
    --copper-text: #D19A52; --accent: #C98A3C; --accent-ink: #0D0D0C;
    --st-approved: #7BC99A; --st-approved-bg: #19301F; --st-review: #E2B45C; --st-review-bg: #33280F;
    --st-revise: #EE8C74; --st-revise-bg: #3A1D16; --st-proposed: #8FB0D6; --st-proposed-bg: #1B2736;
    --st-muted: #A39C90; --st-muted-bg: #25231F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0D0D0C; --surface: #171614; --sunk: #1F1E1B; --ink: #EEEAE3; --muted: #A39C90; --line: #2E2C28;
  --copper-text: #D19A52; --accent: #C98A3C; --accent-ink: #0D0D0C;
  --st-approved: #7BC99A; --st-approved-bg: #19301F; --st-review: #E2B45C; --st-review-bg: #33280F;
  --st-revise: #EE8C74; --st-revise-bg: #3A1D16; --st-proposed: #8FB0D6; --st-proposed-bg: #1B2736;
  --st-muted: #A39C90; --st-muted-bg: #25231F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--f-sans); font-weight: 800; letter-spacing: -.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.5rem); line-height: 1.05; }
h2 { font-size: clamp(1.35rem, 1.1rem + .8vw, 1.8rem); line-height: 1.1; }
h3 { font-size: 1.02rem; line-height: 1.25; font-weight: 700; letter-spacing: -.005em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--copper-text); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .85em; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--f-mark); font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.num { font-variant-numeric: tabular-nums; }
.wrap { padding-inline: clamp(16px, 3vw, 36px); }
.wordmark { font-family: var(--f-mark); font-weight: 400; letter-spacing: .34em; text-transform: uppercase; }
.m-mark { display: inline-block; flex: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border: 1px solid var(--line); background: var(--surface); padding: .55rem .95rem; border-radius: var(--r); cursor: pointer; font-weight: 600; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: var(--copper); border-color: var(--copper); color: #111110; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.sm { padding: .32rem .62rem; font-size: .84rem; }
.btn.ok { color: var(--st-approved); border-color: var(--st-approved); }
.btn.warn { color: var(--st-revise); border-color: var(--st-revise); }

.field { display: grid; gap: .3rem; }
.field > label, .field > .lbl { font-family: var(--f-mark); font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.input, select.input, textarea.input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .58rem .72rem; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { outline: none; border-color: var(--copper); box-shadow: 0 0 0 3px color-mix(in srgb, var(--copper) 22%, transparent); }

.chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .72rem; font-weight: 600; padding: .16rem .5rem; border-radius: var(--r); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-approved { color: var(--st-approved); background: var(--st-approved-bg); }
.s-in_review { color: var(--st-review); background: var(--st-review-bg); }
.s-revise, .s-rejected { color: var(--st-revise); background: var(--st-revise-bg); }
.s-proposed { color: var(--st-proposed); background: var(--st-proposed-bg); }
.s-alternate, .s-muted { color: var(--st-muted); background: var(--st-muted-bg); }
.card .sw .chip, .drawer-photo .chip { background: rgba(17,17,16,.78); color: #F1ECE3; }

/* A&D kit letter (Salesforce L / M / D designation) */
.kit { display: inline-grid; place-items: center; width: 20px; height: 20px; font-family: var(--f-mark); font-weight: 500; font-size: .72rem; border-radius: var(--r); flex: none; }
.kit-L { background: #EDE6DA; color: #3B3428; }
.kit-M { background: #B89A77; color: #1F1A14; }
.kit-D { background: #111110; color: #D6A361; box-shadow: inset 0 0 0 1px #3A352E; }

/* Top bar: the box lid */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--onyx); color: var(--onyx-ink); border-bottom: 1px solid #2A2824; }
.topbar-in { display: flex; align-items: center; gap: 1rem; min-height: 58px; flex-wrap: wrap; padding-block: .4rem; }
.brand { display: flex; align-items: center; gap: .8rem; background: none; border: 0; cursor: pointer; padding: 0; color: var(--onyx-ink); }
.brand .wordmark { font-size: .82rem; color: var(--copper); }
.brand .product { font-family: var(--f-mark); font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--onyx-muted); padding-left: .8rem; border-left: 1px solid #3A3731; }
.topbar .spacer { flex: 1; }
.proto-tag { font-family: var(--f-mark); font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--copper); border: 1px solid #5A4222; border-radius: var(--r); padding: .12rem .45rem; }
.viewas { display: flex; align-items: center; gap: .5rem; font-size: .78rem; color: var(--onyx-muted); white-space: nowrap; }
.viewas select { max-width: 270px; padding: .36rem .5rem; background: var(--onyx-2); color: var(--onyx-ink); border-color: #3A3731; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; background: var(--sunk); color: var(--ink); flex: none; letter-spacing: .02em; }
.topbar .avatar { background: #2A2824; color: var(--copper); }
.avatar-btn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 50%; }

/* Footer: the deck's copper band */
.foot { position: relative; background: var(--copper-deep); color: #FFFFFF; font-family: var(--f-mark); font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; }
.foot-in { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.4rem; min-height: 54px; padding-block: .6rem; }
.foot .div { width: 1px; align-self: stretch; background: rgba(255,255,255,.7); }
.foot .spacer { flex: 1; }
.foot .values { word-spacing: .6em; }

/* ---------- The split: customer (left) fades into Metropolitan (right) ---------- */
.split { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.split .cust { position: absolute; inset: 0; background: #CFC7BA var(--c-banner) center / cover no-repeat; }
.split .cust::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, color-mix(in srgb, #FFFFFF 84%, var(--c-secondary)) 0%, color-mix(in srgb, #FFFFFF 58%, var(--c-secondary)) 34%, color-mix(in srgb, #FFFFFF 12%, transparent) 64%); }
.split .metro { position: absolute; inset: 0; background: var(--onyx);
  -webkit-mask-image: linear-gradient(var(--tilt), transparent 46%, #000 64%); mask-image: linear-gradient(var(--tilt), transparent 46%, #000 64%); }
.split .glow { position: absolute; inset: 0; background: linear-gradient(var(--tilt), transparent 47%, rgba(183,119,41,.30) 54%, transparent 62%); mix-blend-mode: screen; }
.emboss { position: absolute; top: -12px; left: 34%; right: 0; display: grid; align-content: start; font-size: clamp(40px, 4.8vw, 70px); line-height: 1.06; white-space: nowrap; }
.emboss span { color: #171716; text-shadow: 0 1px 0 rgba(255,255,255,.075), 0 -1px 0 rgba(0,0,0,.95); }
.emboss .r { font-weight: 400; text-transform: uppercase; letter-spacing: .02em; }
.emboss .b { font-weight: 800; font-style: italic; }
.space { position: relative; isolation: isolate; }
.space > .split { position: fixed; z-index: -1; }

/* ---------- Login ---------- */
.login { position: relative; min-height: calc(100vh - 54px); overflow: hidden; isolation: isolate; }
.login .split .metro { -webkit-mask-image: linear-gradient(var(--tilt), transparent 40%, #000 56%); mask-image: linear-gradient(var(--tilt), transparent 40%, #000 56%); }
.login .map { position: absolute; right: 2%; bottom: 6%; width: 46%; opacity: .26; mix-blend-mode: screen; }
.login .split .cust::after { background: linear-gradient(90deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.28) 34%, rgba(255,255,255,0) 60%); }
.login-grid { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: inherit; }
.login-day { align-self: end; padding-block: clamp(24px, 5vw, 56px); color: #141414; }
.card-quote { background: rgba(255,255,255,.92); padding: 18px 20px; max-width: 360px; display: grid; gap: .3rem; }
.card-quote .eyebrow { color: #67625A; }
.card-quote b { font-weight: 800; font-size: 1.25rem; letter-spacing: -.01em; line-height: 1.15; }
.login-form { align-self: center; justify-self: end; width: min(400px, 100%); display: grid; gap: 1.05rem; color: var(--onyx-ink); padding-block: 40px; }
.login-form .wordmark { color: var(--copper); font-size: .95rem; }
.login-form h1 { color: #FFFFFF; }
.login-form .field > label { color: var(--onyx-muted); }
.login-form .input { background: var(--onyx-2); border-color: #3A3731; color: var(--onyx-ink); }
.login-form .btn { width: 100%; }
.login-form .btn.primary { background: var(--copper); border-color: var(--copper); color: #111110; }
.login-form .btn.primary:hover { background: #D08B35; }
.login-form .btn.alt { background: transparent; color: var(--onyx-ink); border-color: #4A463F; }
.login-form .btn.alt:hover { border-color: var(--copper); }
.divider { display: flex; align-items: center; gap: .75rem; color: var(--onyx-muted); font-family: var(--f-mark); font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #3A3731; }
.ms-logo { width: 14px; height: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.ms-logo i { background: var(--onyx-muted); }
.login .fine { font-size: .8rem; color: var(--onyx-muted); border-top: 1px solid #2A2824; padding-top: .9rem; }
.tagline { font-family: var(--f-sans); font-size: .88rem; color: var(--copper); }
.tagline b { font-weight: 800; font-style: italic; }

/* ---------- Pages ---------- */
.page { padding-block: 0 64px; display: grid; gap: 22px; max-width: 1320px; margin-inline: auto; }
.band { background: var(--onyx); color: var(--onyx-ink); padding: 24px clamp(18px, 2.4vw, 28px); display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem; }
.band .eyebrow { color: var(--onyx-muted); margin-bottom: .45rem; }
.band h1, .band h2 { color: #FFFFFF; }
.band .btn { background: transparent; color: var(--onyx-ink); border-color: #4A463F; }
.band .btn:hover { border-color: var(--copper); color: #FFFFFF; }
.band .btn.primary { background: var(--copper); border-color: var(--copper); color: #111110; }
.band .btn.primary:hover { background: #D08B35; }
.band .chip { background: #2A2824; color: var(--onyx-ink); }
.page-band { margin-inline: calc(-1 * clamp(16px, 3vw, 36px)); padding-inline: clamp(16px, 3vw, 36px); }

.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.proj-card { text-align: left; background: var(--surface); border: 1px solid var(--line); overflow: hidden; cursor: pointer; padding: 0; display: grid; border-radius: var(--r); transition: box-shadow .2s, transform .2s; }
.proj-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.pc-top { position: relative; height: 158px; }
.pc-top .c-name { position: absolute; left: 16px; bottom: 14px; right: 44%; display: grid; gap: .1rem; }
.pc-top .c-name .brandname { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; }
.pc-top .c-name b { font-size: 1.45rem; line-height: 1.05; font-weight: 600; }
.pc-top .pc-mark { position: absolute; right: 18px; top: 18px; }
.pc-body { padding: 14px 16px 16px; display: grid; gap: .55rem; }
.pc-meta { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: .8rem; color: var(--muted); }
.bar { height: 5px; background: var(--sunk); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }

/* ---------- Customer space: hero sits directly on the split ---------- */
.hero { position: relative; }
.hero-in { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; min-height: 360px; padding-block: clamp(26px, 4vw, 48px); max-width: 1320px; margin-inline: auto; }
.hero-day { display: grid; align-content: end; gap: .6rem; max-width: 600px; color: var(--c-primary); }
.c-logo { display: inline-flex; align-items: center; gap: .7rem; font-family: var(--c-font); font-size: 1.05rem; letter-spacing: .16em; text-transform: uppercase; }
.c-logo img { max-height: 44px; max-width: 170px; }
.c-mono { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--c-primary); color: #FFFFFF; font-size: .82rem; letter-spacing: .02em; }
.c-title { font-family: var(--c-font); font-weight: 600; font-size: clamp(2.1rem, 1.4rem + 2.6vw, 3.6rem); line-height: 1; letter-spacing: -.01em; color: var(--c-primary); }
.c-rule { width: 56px; height: 3px; background: var(--c-primary); opacity: .7; }
.hero-day .facts { display: flex; flex-wrap: wrap; gap: .2rem 1.1rem; font-size: .9rem; color: #2E2A26; font-weight: 500; }
.hero-night { justify-self: end; width: min(340px, 100%); display: grid; align-content: space-between; gap: 1.3rem; color: var(--onyx-ink); }
.hero-night .lock { display: grid; justify-items: start; gap: .7rem; }
.hero-night .wordmark { color: var(--copper); font-size: .9rem; }
.rep-card { display: flex; gap: 12px; align-items: center; }
.rep-card .avatar { width: 46px; height: 46px; background: #2A2824; color: var(--copper); font-size: .95rem; }
.rep-card small { display: block; color: var(--onyx-muted); font-family: var(--f-mark); letter-spacing: .16em; text-transform: uppercase; font-size: .62rem; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 1.4rem; }
.hero-stats div { display: grid; }
.hero-stats b { font-size: 1.6rem; font-weight: 800; color: #FFFFFF; font-variant-numeric: tabular-nums; line-height: 1.1; }
.hero-stats span { font-family: var(--f-mark); font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--onyx-muted); }
.hero.slim .hero-in { min-height: 0; padding-block: 22px; align-items: center; }
.hero.slim .c-title { font-size: clamp(1.5rem, 1.1rem + 1.3vw, 2.2rem); }
.hero.slim .hero-day { gap: .3rem; }
.hero.slim .hero-night { align-content: center; }

.proj-toolbar { background: color-mix(in srgb, var(--surface) 92%, transparent); border-block: 1px solid var(--line); backdrop-filter: blur(8px); }
.proj-toolbar-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem; min-height: 50px; padding-block: .45rem; max-width: 1320px; margin-inline: auto; }
.crumbs { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; font-size: .82rem; color: var(--muted); }
.crumbs button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.url { font-family: var(--f-mono); font-size: .78rem; color: var(--ink); background: var(--sunk); padding: .15rem .5rem; overflow-wrap: anywhere; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--sunk); padding: 3px; border-radius: var(--r); }
.seg button { border: 0; background: none; padding: .32rem .7rem; border-radius: var(--r); cursor: pointer; font-size: .82rem; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: .4rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.preview-bar { background: var(--st-proposed-bg); color: var(--st-proposed); font-size: .85rem; font-weight: 500; padding-block: .55rem; }

.work { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 26px; padding-block: 26px 72px; max-width: 1320px; margin-inline: auto; }
.rail { display: grid; gap: 1px; align-content: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); background: var(--surface); border: 1px solid var(--line); padding: 6px; border-radius: var(--r); box-shadow: var(--shadow); }
.rail button { display: flex; justify-content: space-between; align-items: center; text-align: left; background: none; border: 0; padding: .55rem .7rem; border-radius: var(--r); cursor: pointer; color: var(--muted); font-weight: 600; }
.rail button:hover { background: var(--sunk); color: var(--ink); }
.rail button[aria-current="page"] { background: var(--onyx); color: #FFFFFF; }
.rail button[aria-current="page"] .count { color: var(--copper); }
.rail .count { font-size: .72rem; font-family: var(--f-mono); color: var(--muted); }
.rail-sep { padding: .9rem .7rem .3rem; }
.content { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; min-width: 0; }
.content > * { min-width: 0; }
.content > .panel, .content > .band, .content > .kits, .content > .ov-grid .panel { box-shadow: var(--shadow); }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: .75rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-pad { padding: 18px 20px; }

.ov-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; }
.tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.tally div { padding: 14px 20px; border-right: 1px solid var(--line); display: grid; gap: .1rem; }
.tally div:last-child { border-right: 0; }
.tally b { font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.list { display: grid; }
.list > * { padding: 12px 20px; border-top: 1px solid var(--line); }
.list > *:first-child { border-top: 0; }

/* The split background: customer (left) fades into Metropolitan (right), with embossed cities from the brand book */
function split(p, lines = 12) {
  const home = p ? p.city.split(",")[0] : "Austin";
  const cities = [home, ...METRO_CITIES.filter(x => x !== home)];
  const emb = Array.from({ length: lines }, (_, i) => {
    const c = k => cities[(i * 3 + k) % cities.length];
    return `<div>${i % 2 ? `<span class="b">${c(0)}</span> <span class="r">${c(1)}</span> <span class="b">${c(2)}</span>` : `<span class="r">${c(0)}</span> <span class="b">${c(1)}</span> <span class="r">${c(2)}</span>`}</div>`;
  }).join("");
  return `<div class="split" aria-hidden="true"><div class="cust"></div><div class="metro"><div class="emboss">${emb}</div></div><div class="glow"></div></div>`;
}

function recompute(sel) {
  if (sel.status === "alternate" || sel.status === "proposed" || sel.status === "rejected") return;
  const d = REVIEWERS.map(u => (sel.reviews.find(r => r.user === u) || {}).decision);
  if (d.includes("reject")) sel.status = "rejected";
  else if (d.includes("revise")) sel.status = "revise";
  else if (d.every(x => x === "approve")) sel.status = "approved";
  else sel.status = "in_review";
}

    const t = themeOf(p), c = counts(p), n = p.selections.length || 1;
    const seg = (k, v) => `<i style="width:${(c[k] / n) * 100}%;background:var(--st-${v})"></i>`;
    return `<button class="proj-card" data-act="open-project" data-id="${p.id}" style="${themeVars(t)}">
      <div class="pc-top">${split(p, 4)}
        <div class="c-name" style="color:${t.primary}"><span class="brandname">${esc(t.name)}</span><b style="font-family:'${t.font}',Georgia,serif">${esc(p.name)}</b></div>
        <span class="pc-mark">${MARK(34)}</span>
      </div>
      <div class="pc-body">
        <div class="pc-meta"><span>${esc(p.city)}</span><span>${p.keys} keys</span><span>${esc(p.stage)}</span><span>Opening ${esc(p.openingTarget)}</span></div>
        <div class="bar" aria-label="Selection status">${seg("approved", "approved")}${seg("in_review", "review")}${seg("revise", "revise")}${seg("proposed", "proposed")}</div>
        <div class="pc-meta num"><span>${c.approved} approved</span><span>${c.in_review + c.revise} open decisions</span><span>Consultant: ${esc(USERS[p.rep].name)}</span></div>
      </div></button>`;
  }).join("");
  return `<main class="page wrap">
    <div class="band page-band"><div><p class="eyebrow">${isStaff() ? "Assigned to you" : esc(USERS[me()].org)}</p><h1>Projects</h1></div>
      ${isStaff() ? `<button class="btn primary" data-act="register">+ Register project</button>` : ""}</div>
    ${mine.length ? `<div class="proj-grid">${cards}</div>` : `<div class="panel empty">You haven't been added to a project yet.</div>`}
  </main>`;
}

/* Hero content sits directly on the split: customer on the left, Metropolitan on the right */
function hero(p, slim, t = themeOf(p)) {
  const c = counts(p), pp = planProgress(p), rep = USERS[p.rep];
  const logo = t.logo ? `<img src="${t.logo}" alt="${esc(t.name)}">` : `<span class="c-mono">${esc(t.mark)}</span>${esc(t.name)}`;
  return `<section class="hero ${slim ? "slim" : ""}">
    <div class="hero-in wrap">
      <div class="hero-day">
        <span class="c-logo">${logo}</span>
        <h1 class="c-title">${esc(p.name)}</h1>
        ${slim ? "" : `<span class="c-rule"></span><div class="facts"><span>${esc(p.city)}</span><span>${p.keys} keys</span><span>${esc(p.stage)}</span><span>Opening ${esc(p.openingTarget)}</span></div>`}
      </div>
      <div class="hero-night">
        ${slim ? `<div class="lock" style="grid-auto-flow:column;align-items:center;justify-content:end;gap:.9rem">${MARK(30)}<span class="wordmark" style="font-size:.78rem">Metropolitan</span></div>`
        : `<div class="lock">${MARK(46)}<span class="wordmark">Metropolitan</span><p class="tagline"><b>Stand</b> on pride.</p></div>
          <div class="rep-card">${av(p.rep)}<div><small>Your specification consultant</small><b>${esc(rep.name)}</b></div></div>
          <div class="hero-stats"><div><b>${c.approved}/${p.selections.length}</b><span>Approved</span></div><div><b>${pp.total ? Math.round(pp.done / pp.total * 100) : 0}%</b><span>Plan</span></div><div><b>${c.in_review + c.revise}</b><span>Open decisions</span></div></div>`}
      </div>
    </div>
  </section>`;
}

function projectView() {
  const p = proj(), t = themeOf(p);
  if (!visibleTabs().includes(S.tab)) S.tab = "overview";
  const c = counts(p), pp = planProgress(p);
  const badge = { plan: pp.total ? Math.round(pp.done / pp.total * 100) + "%" : "", selections: c.in_review + c.revise, samples: p.samples.length, documents: p.docs.length, quotes: p.quotes.filter(q => q.status === "Awaiting acceptance").length, messages: p.threads.length, team: p.team.length };
  const rail = visibleTabs().map(tb => `${tb === "branding" ? `<span class="rail-sep eyebrow">Staff only</span>` : ""}<button data-act="tab" data-tab="${tb}" ${S.tab === tb ? 'aria-current="page"' : ""}>${TAB_LABEL[tb]}${badge[tb] ? `<span class="count">${badge[tb]}</span>` : ""}</button>`).join("");
  const body = { overview, plan, selections, samples, documents, quotes, messages, team, branding, internal, engagement }[S.tab]();
  const mode = isStaff() ? `<div class="seg" role="group" aria-label="View mode"><button data-act="preview" data-v="0" aria-pressed="${!S.preview}">Staff view</button><button data-act="preview" data-v="1" aria-pressed="${S.preview}">Client preview</button></div>` : "";
  return `<div class="space" style="${themeVars(t)}">${split(p)}
    ${hero(p, S.tab !== "overview", t)}
    <div class="proj-toolbar"><div class="proj-toolbar-in wrap">
      <div class="crumbs"><button data-act="home">Projects</button><span aria-hidden="true">›</span><span class="url">portal.metrofloors.com/${p.slug}${S.tab === "overview" ? "" : "/" + S.tab}</span></div>${mode}
    </div></div>
    ${S.preview ? `<div class="preview-bar wrap">You're previewing this project as a client sees it. Internal tabs, steps and notes are hidden.</div>` : ""}
    <div class="work wrap"><nav class="rail" aria-label="Project sections">${rail}</nav><div class="content">${body}</div></div>
  </div>`;
}
const band = (eyebrow, title, right = "") => `<div class="band"><div><p class="eyebrow">${eyebrow}</p><h2>${title}</h2></div>${right}</div>`;

/* ---------- Sections ---------- */
function overview() {
  const p = proj(), c = counts(p), rep = USERS[p.rep], pp = planProgress(p);
  const waiting = p.selections.filter(s => ["in_review", "revise"].includes(s.status) && isReviewer() && !s.reviews.some(r => r.user === me()));
  const open = p.selections.filter(s => ["in_review", "revise", "proposed"].includes(s.status));
  const list = isReviewer() ? waiting : open;
  const todo = list.map(s => { const pr = bySku(s.sku); const a = p.areas.find(x => x.id === s.area);
    return `<button class="todo" data-act="open-sel" data-id="${s.id}"><span class="mini-sw" style="${bg(pr.img)}"></span>
      <span class="grow"><b>${esc(pr.line)} ${esc(pr.name)}</b><br><span class="muted">${esc(a.name)}</span></span>${chip(s.status)}</button>`; }).join("");
  const feed = p.activity.map(a => `<div class="feed-item">${av(a.user)}<div><b>${esc(USERS[a.user].name)}</b> ${a.text}<br><span class="muted">${a.when}</span></div></div>`).join("");
  const next = p.plan.flatMap(visibleSteps).filter(k => !k.done).slice(0, 4).map(k => `<div class="mile"><span class="mono">${esc(k.date)}</span><span>${esc(k.t)}<br><span class="muted">${esc(USERS[k.owner].name)}</span> <span class="chip ${STEP_CLS[k.status]}">${k.status}</span></span></div>`).join("");
  const ours = p.team.filter(m => USERS[m.user].staff), theirs = p.team.filter(m => !USERS[m.user].staff);
  const person = m => `<div class="person">${av(m.user)}<div><b>${esc(USERS[m.user].name)}</b><br><span class="muted">${esc(USERS[m.user].title)}${USERS[m.user].staff ? "" : " · " + esc(USERS[m.user].org)}</span></div></div>`;
  return `
    ${p.welcome ? `<div class="panel panel-pad welcome" style="display:grid;gap:.7rem"><p class="eyebrow">A note from ${esc(rep.name)}</p><p>${esc(p.welcome)}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="tab" data-tab="messages">Reply to ${esc(rep.name.split(" ")[0])}</button><button class="btn ghost" data-act="copy" data-text="${esc(rep.email)}">Copy email</button><button class="btn ghost" data-act="copy" data-text="${esc(rep.phone)}">Copy phone ${esc(rep.phone)}</button></div></div>` : ""}
    <div class="panel">
      <div class="panel-pad sec-head"><div><p class="eyebrow">Decision tracker</p><h2>${p.selections.length} selections across ${p.areas.length} areas</h2></div>
        <button class="btn" data-act="tab" data-tab="selections">Open selections</button></div>
      <div class="tally num">
        <div><b style="color:var(--st-approved)">${c.approved}</b><span class="muted">Approved</span></div>
        <div><b style="color:var(--st-review)">${c.in_review}</b><span class="muted">In review</span></div>
        <div><b style="color:var(--st-revise)">${c.revise}</b><span class="muted">Revision requested</span></div>
        <div><b style="color:var(--st-proposed)">${c.proposed + c.alternate}</b><span class="muted">Proposed / alternate</span></div>
      </div>
    </div>
    <div class="ov-grid">
      <div style="display:grid;gap:18px;align-content:start;min-width:0">
        <div class="panel"><div class="panel-pad"><h3>${isReviewer() ? "Waiting on your review" : "Open decisions"}</h3></div><div class="list">${todo || `<div class="empty">Nothing waiting on you.</div>`}</div></div>
        <div class="panel"><div class="panel-pad"><h3>Recent activity</h3></div><div class="list">${feed || `<div class="empty">No activity yet.</div>`}</div></div>
      </div>
      <div style="display:grid;gap:18px;align-content:start;min-width:0">
        <div class="panel"><div class="panel-pad sec-head"><h3>Next steps</h3><button class="btn ghost sm" data-act="tab" data-tab="plan">Plan · ${pp.done}/${pp.total}</button></div><div class="miles">${next || `<div class="empty">All steps complete.</div>`}</div></div>
        <div class="panel panel-pad stake"><h3>Stakeholders</h3><p class="eyebrow">Metropolitan</p>${ours.map(person).join("")}<p class="eyebrow">Project team</p>${theirs.map(person).join("")}</div>
      </div>
    </div>`;
}

function plan() {
  const p = proj(), pp = planProgress(p), pct = pp.total ? Math.round(pp.done / pp.total * 100) : 0;
  const stages = p.plan.map(st => {
    const steps = visibleSteps(st);
    const rows = steps.map(k => `<div class="step ${k.done ? "done" : ""}">
        <input type="checkbox" class="tick" id="step-${k.id}" data-step="${k.id}" ${k.done ? "checked" : ""} ${staffView() || k.owner === me() ? "" : "disabled"} aria-label="Mark done">
        <label for="step-${k.id}" class="step-t">${esc(k.t)} ${k.internal ? `<span class="chip s-proposed">Internal</span>` : ""}</label>
        <span class="chip ${k.done ? "s-approved" : STEP_CLS[k.status]}">${k.done ? "Done" : k.status}</span>
        <span class="mono step-date">${esc(k.date)}</span>${av(k.owner)}</div>`).join("");
    return `<div class="panel"><div class="panel-pad sec-head"><h3>${esc(st.name)}</h3><span class="mono muted">${steps.filter(k => k.done).length}/${steps.length}</span></div>
      <div class="steps">${rows}</div>
      ${staffView() ? `<form class="add-step" data-form="add-step" data-stage="${st.id}"><input class="input" id="new-step-${st.id}" placeholder="Add a step"><label class="inline"><input type="checkbox" id="new-int-${st.id}"> Internal</label><button class="btn sm" type="submit">Add</button></form>` : ""}</div>`;
  }).join("");
  return `${band("Shared action plan", "Plan", `<div class="progress"><span class="num mono">${pct}%</span><div class="bar" style="width:160px;background:#2A2824"><i style="width:${pct}%;background:var(--copper)"></i></div>${staffView() ? `<button class="btn sm" data-act="toast" data-msg="Emails each assignee their open steps and due dates.">Notify assignees</button>` : ""}</div>`)}
    ${staffView() ? `<p class="note">Progress counts only steps the client can see. Internal steps stay with the Metropolitan team.</p>` : ""}
    ${stages}`;
}

function selections() {
  const p = proj(), q = S.f.q.trim().toLowerCase();
  const match = s => { const pr = bySku(s.sku);
    return (S.f.kit === "all" || kitOf(pr) === S.f.kit) && (!S.f.fam || pr.family === S.f.fam)
      && (!q || [pr.line, pr.name, pr.sku, pr.family].join(" ").toLowerCase().includes(q)); };
  const kits = [["all", "All"], ["L", "Light"], ["M", "Medium"], ["D", "Dark"]]
    .map(([k, l]) => `<button data-act="kit" data-v="${k}" aria-pressed="${S.f.kit === k}">${k === "all" ? "" : kitBadge(k)}${l}</button>`).join("");
  const fams = FAMILIES.filter(f => S.f.kit === "all" || f.kit === S.f.kit).map(f => `<button class="fam" data-act="fam" data-v="${esc(f.name)}" aria-pressed="${S.f.fam === f.name}" style="${bg(f.img)}" title="${esc(f.name)} · ${f.kit}" aria-label="${esc(f.name)}"></button>`).join("");
  const blocks = p.areas.map(a => {
    const items = p.selections.filter(s => s.area === a.id && match(s));
    if (!items.length) return "";
    return `<section class="area-block"><div class="area-head"><h3>${esc(a.name)}</h3><span class="mono muted">${esc(a.qty)}</span></div><div class="cards">${items.map(card).join("")}</div></section>`;
  }).join("");
  return `${band("Project catalog", "Selections", isStaff() ? `<button class="btn primary" data-act="add-product">+ Add product</button>` : "")}
    <div class="panel panel-pad filters">
      <div class="toolbar"><div class="seg" role="group" aria-label="A&D kit">${kits}</div><input class="input search" id="sel-search" type="search" placeholder="Search line, colour, SKU" value="${esc(S.f.q)}"></div>
      <div class="families" role="group" aria-label="Colour family">${fams}<span class="fam-label">${S.f.fam ? `${esc(S.f.fam)} <button class="linkish" data-act="fam" data-v="">Clear</button>` : "Colour families"}</span></div>
    </div>
    ${blocks || `<div class="panel empty">No selections match these filters.</div>`}`;
}
function card(s) {
  const pr = bySku(s.sku);
  const dots = REVIEWERS.map(u => { const r = s.reviews.find(x => x.user === u); return `<i class="${r ? r.decision : ""}" title="${esc(USERS[u].name)}: ${r ? r.decision : "pending"}"></i>`; }).join("");
  const approvals = s.reviews.filter(r => r.decision === "approve").length;
  return `<button class="card" data-act="open-sel" data-id="${s.id}">
    <div class="sw" style="${bg(pr.img)}">${chip(s.status)}${kitBadge(kitOf(pr))}</div>
    <div class="card-body"><span class="line">${esc(pr.line)}</span><h3>${esc(pr.name)}</h3>
      <span class="muted" style="font-size:.84rem">${esc(pr.family)} · <span class="mono">${esc(pr.sku)}</span></span>
      <div class="card-foot"><span class="num">${esc(s.qty)}</span><span style="display:inline-flex;gap:.4rem;align-items:center"><span class="votes">${dots}</span>${approvals}/3</span></div>
    </div></button>`;
}

function drawer() {
  const p = proj(), s = p.selections.find(x => x.id === S.sel); if (!s) return "";
  const pr = bySku(s.sku), a = p.areas.find(x => x.id === s.area), fam = famBy(pr.family);
  const specs = Object.entries({ ...pr.specs, "Colour family": `${fam.name} · ${fam.kit}`, "A&D kit": `${KIT_NAME[fam.kit]} Collection` }).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  const docs = p.docs.filter(d => d.sku === s.sku);
  const mine = s.reviews.find(r => r.user === me());
  const reviews = REVIEWERS.map(u => { const r = s.reviews.find(x => x.user === u);
    const lab = r ? { approve: ["approved", "Approved"], revise: ["revise", "Revision requested"], reject: ["rejected", "Rejected"] }[r.decision] : ["muted", "Pending"];
    return `<div class="review">${av(u)}<div><div class="who"><b>${esc(USERS[u].name)}</b><span class="muted">${esc(USERS[u].org)}</span><span class="chip s-${lab[0]}">${lab[1]}</span>${r ? `<span class="muted">${r.when}</span>` : ""}</div>${r && r.comment ? `<p>${esc(r.comment)}</p>` : ""}</div></div>`; }).join("");
  const thread = p.threads.find(t => t.anchor === s.id);
  const decide = isReviewer() && s.status !== "proposed" && s.status !== "alternate" ? `
    <form class="decide" data-form="decide"><b>${mine ? "Update your decision" : "Your decision"}</b>
      <textarea class="input" id="decide-comment" placeholder="Comment for the project team (optional for approval)"></textarea>
      <div class="row"><button class="btn ok" type="submit" data-decision="approve">Approve</button><button class="btn warn" type="submit" data-decision="revise">Request revision</button><button class="btn ghost" type="submit" data-decision="reject">Reject</button></div></form>` : "";
  const staffCtl = isStaff() ? `
    <div class="decide"><b>Consultant controls</b><div class="row">
      ${s.status === "proposed" ? `<button class="btn primary" data-act="send-review">Send for review</button>` : ""}
      ${s.status === "revise" || s.status === "rejected" ? `<button class="btn" data-act="add-product" data-alt="${s.area}">Propose alternate</button>` : ""}
      <label class="field" style="min-width:200px"><span class="lbl">Set status</span><select class="input" id="staff-status">${Object.entries(STATUS).map(([k, l]) => `<option value="${k}" ${k === s.status ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    </div></div>` : "";
  return `<div class="scrim" data-act="close"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(pr.line + " " + pr.name)}">
    <div class="drawer-photo" style="${bg(pr.img)}"><button class="close" data-act="close" aria-label="Close">×</button>${chip(s.status)}</div>
    <div class="drawer-head"><span class="line">${esc(pr.line)}</span><h2>${esc(pr.name)}</h2>
      <span class="muted"><span class="mono">${esc(pr.sku)}</span> · ${esc(a.name)} · ${esc(s.qty)}</span></div>
    <div class="drawer-body">
      ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button class="btn" data-act="req-sample" data-id="${s.id}">Request sample</button>
        ${thread ? `<button class="btn" data-act="goto-thread" data-id="${thread.id}">Discussion (${visibleMsgs(thread).length})</button>` : `<button class="btn" data-act="new-thread-for" data-id="${s.id}">Ask a question</button>`}
      </div>
      ${decide}${staffCtl}
      <div><h3 style="margin-bottom:.4rem">Reviews <span class="muted num" style="font-weight:400">${s.reviews.filter(r => r.decision === "approve").length} of 3 approved</span></h3>${reviews}</div>
      <div><h3 style="margin-bottom:.6rem">Specifications</h3><dl class="kv">${specs}</dl></div>
      <div><h3 style="margin-bottom:.4rem">Documents</h3>${docs.length ? docs.map(d => `<div class="cat-row"><span class="ftype">PDF</span><span class="grow">${esc(d.name)}<br><span class="muted mono">${esc(d.ver)} · ${esc(d.size)}</span></span><button class="btn sm" data-act="toast" data-msg="Downloads use short-lived signed links in the real build.">Download</button></div>`).join("") : `<p class="muted">No product documents attached yet.</p>`}</div>
    </div>
  </aside>`;
}

function samples() {
  const p = proj();
  const kits = KITS.map(k => `<div class="kit-card"><div class="ph" style="${bg(k.img)}"></div><div class="kc-body">
      <b>${k.key === "B" ? "" : kitBadge(k.key) + " "}${esc(k.name)}</b><span class="muted">${esc(k.note)}</span>
      <button class="btn sm" data-act="kit-pick" data-v="${k.key}" aria-pressed="${S.kitDraft.includes(k.key)}">${S.kitDraft.includes(k.key) ? "Added" : "Add to request"}</button></div></div>`).join("");
  const opts = p.selections.map(s => { const pr = bySku(s.sku);
    return `<label><input type="checkbox" name="sample" value="${s.id}" ${S.sampleDraft.includes(s.id) ? "checked" : ""}><span class="mini-sw" style="${bg(pr.img)};width:40px;height:28px"></span><span>${esc(pr.line)} ${esc(pr.name)} <span class="muted">· ${esc(pr.family)}</span></span></label>`; }).join("");
  const rows = p.samples.map(r => `<tr><td class="mono">${r.id}</td><td>${r.items.map(esc).join("<br>")}</td><td>${esc(r.shipTo)}</td><td>${esc(USERS[r.by].name)}<br><span class="muted">${r.date}</span></td>
    <td><span class="chip ${r.status === "Delivered" ? "s-approved" : r.status === "Requested" ? "s-proposed" : "s-in_review"}">${r.status}</span></td></tr>`).join("");
  return `${band("A&D kits, samples & literature", "Samples & kits")}
    <div class="kits">${kits}</div>
    <form class="panel panel-pad" data-form="sample" style="display:grid;gap:14px">
      <h3>New sample request</h3>
      ${S.kitDraft.length ? `<p class="note">Kits in this request: ${S.kitDraft.map(k => esc(KITS.find(x => x.key === k).name)).join(", ")}</p>` : ""}
      <div class="field"><span class="lbl">Product samples from this project</span><div class="checks">${opts}</div></div>
      <div class="form-grid">
        <div class="field"><label for="smp-qty">Sample size</label><select class="input" id="smp-qty"><option>Hand sample ×2</option><option>Full plank ×1</option><option>Full plank ×2</option><option>Design board set</option></select></div>
        <div class="field"><label for="smp-date">Needed by</label><input class="input" id="smp-date" type="date" value="2026-10-09"></div>
        <div class="field full"><label for="smp-ship">Ship to</label><input class="input" id="smp-ship" value="${esc(USERS[me()].org)}"></div>
      </div>
      <div><button class="btn primary" type="submit">Submit request</button></div>
    </form>
    <div class="panel tbl-wrap"><table><thead><tr><th>Request</th><th>Items</th><th>Ship to</th><th>Requested</th><th>Status</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="muted">No sample requests yet.</td></tr>`}</tbody></table></div>`;
}

function documents() {
  const p = proj();
  const segs = ["All", "Drawings", "Specs", "Submittals", "Product data"].map(c => `<button data-act="doccat" data-v="${c}" aria-pressed="${S.docCat === c}">${c}</button>`).join("");
  const list = p.docs.filter(d => S.docCat === "All" || d.cat === S.docCat);
  const ext = n => (n.split(".").pop() || "").toUpperCase().slice(0, 4);
  const rows = list.map(d => `<tr><td><div class="doc-name"><span class="ftype">${ext(d.name)}</span><div>${esc(d.name)}</div></div></td><td>${esc(d.cat)}</td><td class="mono">${esc(d.ver)}</td><td>${esc(USERS[d.by].name)}<br><span class="muted">${esc(d.date)}</span></td><td class="r mono">${esc(d.size)}</td>
    <td><button class="btn sm" data-act="toast" data-msg="Downloads use short-lived signed links in the real build.">Download</button></td></tr>`).join("");
  return `${band("Drawings, specifications & submittals", "Documents")}
    <label class="drop" id="drop"><b>Drop files to upload</b><span>or choose files. PDF, DWG, DOCX, XLSX, images</span><input type="file" id="doc-upload" multiple style="max-width:100%"></label>
    <div class="panel"><div class="panel-pad"><div class="seg" role="group" aria-label="Filter by category">${segs}</div></div>

function quotes() {
  const p = proj();
  if (!p.quotes.length) return `${band("Pricing", "Quotes")}<div class="panel empty">No quotes yet. Your specification consultant will post quotes here.</div>`;
  const blocks = p.quotes.map(q => {
    const total = q.lines.reduce((t, l) => t + l.qty * l.price, 0);
    const st = q.status === "Accepted" ? "s-approved" : q.status === "Superseded" ? "s-muted" : "s-in_review";
    const lines = q.lines.map(l => `<tr><td class="mono">${esc(l.sku)}</td><td>${esc(l.desc)}${l.area ? `<br><span class="muted">${esc(l.area)}</span>` : ""}</td><td class="r">${l.qty.toLocaleString()} ${l.unit}</td><td class="r">${money(l.price)}</td><td class="r">${money(l.qty * l.price)}</td></tr>`).join("");
    const canAccept = q.status === "Awaiting acceptance" && canAdmin() && !isStaff();
    return `<div class="panel"><div class="quote-head">
        <div style="display:grid;gap:.25rem"><span class="mono muted">${q.id} · v${q.ver}</span><h3>${esc(q.title)}</h3><span class="muted">Issued ${q.date} · valid until ${q.valid}</span></div>
        <div style="display:grid;gap:.5rem;justify-items:end;align-content:start"><span class="chip ${st}">${q.status}</span><b class="num" style="font-size:1.5rem;font-weight:800">${money(total)}</b></div>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>SKU</th><th>Description</th><th class="r">Qty</th><th class="r">Unit</th><th class="r">Extended</th></tr></thead><tbody>${lines}</tbody>
        <tfoot><tr><td colspan="4">Total (excl. tax)</td><td class="r">${money(total)}</td></tr></tfoot></table></div>
      ${q.status === "Superseded" ? "" : S.confirmQuote === q.id ? `<div class="confirm"><b>Accept ${q.id} v${q.ver} for ${money(total)}?</b><span class="muted">Your consultant is notified and the order is prepared for your PO.</span>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="accept-quote" data-id="${q.id}">Confirm acceptance</button><button class="btn ghost" data-act="cancel-quote">Cancel</button></div></div>`
        : `<div style="display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 20px"><button class="btn" data-act="toast" data-msg="Opens the quote PDF in the real build.">View PDF</button>
          ${canAccept ? `<button class="btn primary" data-act="ask-accept" data-id="${q.id}">Accept quote</button>` : ""}<button class="btn ghost" data-act="tab" data-tab="messages">Ask about this quote</button></div>`}
    </div>`;
  }).join("");
  return `${band("Pricing", "Quotes", isStaff() ? `<button class="btn primary" data-act="toast" data-msg="Consultants upload a quote PDF and line items (phase 1), or pull from Salesforce/M3 (phase 2).">+ Post quote</button>` : "")}${blocks}`;
}

function messages() {
  const p = proj();
  if (!p.threads.length && S.thread !== "new") S.thread = "new";
  const t = p.threads.find(x => x.id === S.thread);
  const anchorName = id => { const s = p.selections.find(x => x.id === id); return s ? `${bySku(s.sku).line} ${bySku(s.sku).name}` : ""; };
  const list = p.threads.map(th => { const last = visibleMsgs(th)[visibleMsgs(th).length - 1];
    return `<button class="thread-btn" data-act="thread" data-id="${th.id}" aria-current="${th.id === S.thread}"><b>${esc(th.subject)}</b>${th.anchor ? `<span class="anchor">↳ ${esc(anchorName(th.anchor))}</span>` : ""}<span class="muted" style="font-size:.8rem">${esc(USERS[last.user].name)} · ${esc(last.when)}</span></button>`; }).join("");
  const convo = t ? `<div class="convo-head"><h3>${esc(t.subject)}</h3>${t.anchor ? `<button class="btn ghost sm" style="justify-self:start" data-act="open-sel" data-id="${t.anchor}">↳ ${esc(anchorName(t.anchor))}</button>` : ""}</div>
      <div class="msgs">${visibleMsgs(t).map(m => `<div class="msg ${USERS[m.user].staff ? "staff" : ""} ${m.internal ? "internal" : ""}">${av(m.user)}<div><div class="meta"><b>${esc(USERS[m.user].name)}</b>${USERS[m.user].staff ? `<span class="staff-tag">Metropolitan</span>` : `<span>${esc(USERS[m.user].org)}</span>`}<span>${esc(m.when)}</span>${m.internal ? `<span class="chip s-proposed">Internal note</span>` : ""}</div>
        <div class="bubble">${esc(m.body)}${m.file ? `<div><span class="attach">📎 ${esc(m.file)}</span></div>` : ""}</div></div></div>`).join("")}</div>
      <form class="composer" data-form="reply">${staffView() ? `<select class="input" id="reply-vis" style="max-width:280px" aria-label="Who sees this"><option value="public">Everyone on this project</option><option value="internal">Internal note (staff only)</option></select>` : `<label for="reply-body" class="eyebrow">Reply to everyone on this thread</label>`}<textarea class="input" id="reply-body" placeholder="Write a message"></textarea>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between"><input type="file" id="reply-file" style="max-width:100%"><button class="btn primary" type="submit">Send</button></div></form>`
    : `<div class="convo-head"><h3>New thread</h3></div>

        <div class="field"><label for="nt-subject">Subject</label><input class="input" id="nt-subject" value="${esc(S.ntSubject || "")}"></div>
        <div class="field"><label for="nt-anchor">About a selection (optional)</label><select class="input" id="nt-anchor"><option value="">General</option>${p.selections.map(s => `<option value="${s.id}" ${S.ntAnchor === s.id ? "selected" : ""}>${esc(anchorName(s.id))}</option>`).join("")}</select></div>
        <div class="field"><label for="nt-body">Message</label><textarea class="input" id="nt-body"></textarea></div>
        <div><button class="btn primary" type="submit">Start thread</button></div></form><div></div>`;
  return `${band("Project conversations", "Messages", `<button class="btn" data-act="thread" data-id="new">+ New thread</button>`)}
    <div class="panel msg-layout"><div class="threads">${list || `<div class="empty">No threads yet.</div>`}</div><div class="convo">${convo}</div></div>`;
}

function internal() {
  const p = proj();
  if (!p.crm) return `${band("Staff only · never sent to clients", "Internal")}<div class="panel empty">No Salesforce opportunity linked yet.</div>`;
  const crm = Object.entries(p.crm).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  const steps = p.plan.flatMap(st => st.steps.filter(k => k.internal)).map(k => `<div class="mile"><span class="mono">${esc(k.date)}</span><span>${esc(k.t)} <span class="muted">· ${esc(USERS[k.owner].name)}</span></span></div>`).join("");
  const notes = p.threads.flatMap(t => t.msgs.filter(m => m.internal).map(m => `<div class="feed-item">${av(m.user)}<div><b>${esc(USERS[m.user].name)}</b> in <button class="linkish" data-act="goto-thread" data-id="${t.id}">${esc(t.subject)}</button><br>${esc(m.body)}</div></div>`)).join("");
  return `${band("Staff only · never sent to clients", "Internal")}
    <div class="ov-grid">
      <div style="display:grid;gap:18px;align-content:start;min-width:0">
        <form class="panel panel-pad" data-form="notes" style="display:grid;gap:10px"><h3>Handoff notes</h3><textarea class="input" id="internal-notes" style="min-height:140px">${esc(p.notes)}</textarea><div><button class="btn sm" type="submit">Save notes</button></div></form>
        <div class="panel"><div class="panel-pad"><h3>Internal notes on threads</h3></div><div class="list">${notes || `<div class="empty">No internal notes.</div>`}</div></div>
      </div>
      <div style="display:grid;gap:18px;align-content:start;min-width:0">
        <div class="panel panel-pad" style="display:grid;gap:10px"><div class="sec-head"><h3>Salesforce opportunity</h3><span class="muted" style="font-size:.78rem">Synced 12 min ago</span></div><dl class="kv">${crm}</dl></div>

function engagement() {
  const p = proj(), e = p.engagement;
  if (!e) return `${band("Staff only · last 30 days", "Engagement")}<div class="panel empty">No client visits yet. Engagement appears once invited people sign in.</div>`;
  const max = Math.max(...e.tabs.map(t => t[1]));
  const bars = e.tabs.map(([n, v]) => `<div class="hbar" title="${esc(n)}: ${v}% of time"><span>${esc(n)}</span><div class="track"><i style="width:${v / max * 100}%"></i></div><span class="num mono">${v}%</span></div>`).join("");
  const people = e.people.map(([u, last, visits, time, act]) => `<tr><td><div class="doc-name">${av(u)}<div>${esc(USERS[u].name)}<br><span class="muted">${esc(USERS[u].org)}</span></div></div></td><td>${esc(last)}</td><td class="r">${visits}</td><td class="r">${esc(time)}</td><td>${esc(act)}</td></tr>`).join("");
  const content = e.content.map(([n, v, d, l]) => `<tr><td>${esc(n)}</td><td class="r">${v}</td><td class="r">${d}</td><td>${esc(l)}</td></tr>`).join("");
  return `${band("Staff only · last 30 days", "Engagement", `<span class="chip">${esc(e.trend)}</span>`)}
    <div class="panel tally kpis num">${e.kpis.map(([k, v]) => `<div><b>${esc(v)}</b><span class="muted">${esc(k)}</span></div>`).join("")}</div>
    <div class="ov-grid">
      <div class="panel" style="min-width:0"><div class="panel-pad"><h3>Who's engaged</h3></div><div class="tbl-wrap"><table><thead><tr><th>Person</th><th>Last visit</th><th class="r">Visits</th><th class="r">Time</th><th>Last action</th></tr></thead><tbody>${people}</tbody></table></div></div>
      <div class="panel panel-pad" style="display:grid;gap:10px;align-content:start;min-width:0"><h3>Where time is spent</h3>${bars}</div>
    </div>
    <div class="panel"><div class="panel-pad"><h3>Most-viewed documents</h3></div><div class="tbl-wrap"><table><thead><tr><th>Document</th><th class="r">Views</th><th class="r">Downloads</th><th>Last viewed</th></tr></thead><tbody>${content}</tbody></table></div></div>`;
}

/* ---------- Modals ---------- */
function registerModal() {
  const m = S.modal, t = TEMPLATES[m.tpl], o = OPPS.find(x => x.id === m.opp);
  const taken = new Set(PROJECTS.map(p => p.oppId));
  const oppOpts = OPPS.map(x => `<option value="${x.id}" ${x.id === m.opp ? "selected" : ""} ${taken.has(x.id) ? "disabled" : ""}>${esc(x.name)}${taken.has(x.id) ? " (registered)" : ""}</option>`).join("");
  const tplOpts = Object.entries(TEMPLATES).map(([k, v]) => `<label><input type="radio" name="tpl" value="${k}" ${k === m.tpl ? "checked" : ""}><span><b>${esc(v.name)}</b><br><span class="muted" style="font-size:.8rem">${esc(v.scope)}</span></span></label>`).join("");
  return `<div class="scrim" data-act="close"></div><form class="modal wide" role="dialog" aria-modal="true" aria-label="Register project" data-form="register">
    ${band("New project", "Register project", `<button class="btn" type="button" data-act="close">Close</button>`)}
    <div class="modal-body">
      <div class="field"><label for="reg-opp">Salesforce opportunity</label><select class="input" id="reg-opp">${oppOpts}</select><span class="muted" style="font-size:.8rem">${esc(o.account)} · ${esc(o.city)} · ${o.keys} keys · ${esc(o.amount)}</span></div>
      <div class="field"><span class="lbl">Brand template</span><div class="checks tpl-grid">${tplOpts}</div></div>
      <div class="tpl-preview"><p class="eyebrow">This template sets up</p>
        <div class="form-grid"><div><b>Areas</b><ul>${t.areas.map(a => `<li>${esc(a[0])} <span class="mono muted">${a[1]}</span></li>`).join("")}</ul></div>
        <div><b>Plan</b><ul>${t.plan.map(st => `<li>${esc(st[0])} <span class="muted">· ${st[1].length} steps</span></li>`).join("")}</ul></div></div>
        <p class="muted" style="font-size:.8rem">Placeholder contents. Real templates come from Marketing's brand standards.</p></div>
      <div><button class="btn primary" type="submit">Create project</button></div>
    </div></form>`;
}
function notifyModal() {
  const staff = isStaff(), prefs = S.prefs[S.role] || (S.prefs[S.role] = {});

    <div class="modal-body"><p class="note">${staff ? "Salesforce notifications appear in your bell and the Salesforce mobile app and open the linked opportunity. Email is used if you have no Salesforce user." : "We email you at your sign-in address. Choose a daily digest to get one summary each morning."}</p>
    <div class="tbl-wrap"><table><thead><tr><th>When</th><th>Send to</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  </div>`;
}
function addModal() {
  const p = proj(), inProj = new Set(p.selections.map(s => s.sku)), q = (S.modal.q || "").toLowerCase();

/* ---------- Render + events ---------- */
function render() {
  const main = S.view === "login" ? loginView() : S.view === "projects" ? projectsView() : projectView();
  const mk = S.modal && S.modal.kind;
  const overlay = mk === "register" ? registerModal() : mk === "notify" ? notifyModal() : S.view === "project" && S.modal ? addModal() : S.view === "project" && S.sel ? drawer() : "";
  const active = document.activeElement && document.activeElement.id, caret = active && document.activeElement.selectionStart;
  $app.innerHTML = (S.view === "login" ? "" : topbar()) + main + footer() + overlay + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : "");
  if (active === "sel-search" || active === "add-q") { const el = document.getElementById(active); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} } }
  setHash();
}
function go(patch) { Object.assign(S, patch); render(); if (patch.tab || patch.view) window.scrollTo({ top: 0 }); }
function readImage(file, cb) { if (!file) return; const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(file); }

$app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, p = S.view === "project" ? proj() : null;
  switch (a) {
    case "login-staff": return go({ view: "projects", role: "rep" });
    case "preview": return go({ preview: el.dataset.v === "1", sel: null });
    case "home": return go({ view: "projects", sel: null, modal: null });
    case "open-project": return go({ view: "project", pid: el.dataset.id, tab: "overview", sel: null, f: { kit: "all", fam: null, q: "" }, thread: (PROJECTS.find(x => x.id === el.dataset.id).threads[0] || {}).id || "new" });
    case "tab": return go({ tab: el.dataset.tab, sel: null, modal: null });
    case "open-sel": return go({ sel: el.dataset.id, modal: null });
    case "close": return go({ sel: null, modal: null });
    case "register": { const taken = new Set(PROJECTS.map(p => p.oppId)); return go({ modal: { kind: "register", opp: (OPPS.find(o => !taken.has(o.id)) || OPPS[0]).id, tpl: "marriott" } }); }
    case "notify": return go({ modal: { kind: "notify" }, sel: null });
    case "kit": S.f.kit = el.dataset.v; if (S.f.fam && S.f.kit !== "all" && famBy(S.f.fam).kit !== S.f.kit) S.f.fam = null; return render();
    case "fam": S.f.fam = el.dataset.v && S.f.fam !== el.dataset.v ? el.dataset.v : null; return render();
    case "doccat": S.docCat = el.dataset.v; return render();
    case "thread": S.ntSubject = ""; S.ntAnchor = ""; return go({ thread: el.dataset.id });
    case "goto-thread": return go({ tab: "messages", thread: el.dataset.id, sel: null });
    case "new-thread-for": { const s = p.selections.find(x => x.id === el.dataset.id), pr = bySku(s.sku); S.ntSubject = `Question about ${pr.line} ${pr.name}`; S.ntAnchor = s.id; return go({ tab: "messages", thread: "new", sel: null }); }
    case "req-sample": S.sampleDraft = [el.dataset.id]; return go({ tab: "samples", sel: null });
    case "kit-pick": { const k = el.dataset.v; S.kitDraft = S.kitDraft.includes(k) ? S.kitDraft.filter(x => x !== k) : [...S.kitDraft, k]; return render(); }
    case "add-product": return go({ modal: { area: el.dataset.alt || p.areas[0].id, q: "", alt: !!el.dataset.alt }, sel: null });
    case "add-sku": {
      const area = document.getElementById("add-area").value, pr = bySku(el.dataset.sku);
      const sel = { id: id("s"), area, sku: pr.sku, status: S.modal.alt ? "in_review" : "proposed", qty: p.areas.find(x => x.id === area).qty, note: S.modal.alt ? "Alternate proposed by your consultant." : "", reviews: [] };
      p.selections.push(sel);
      p.activity.unshift({ user: me(), text: `added <b>${esc(pr.line + " " + pr.name)}</b> to ${esc(p.areas.find(x => x.id === area).name)}`, when: "Just now" });
      S.modal = null; S.tab = "selections"; return toast(`${pr.line} ${pr.name} added. Product details copied from the catalog.`);
    }
    case "send-review": { const s = p.selections.find(x => x.id === S.sel); s.status = "in_review"; return toast("Sent for review. Reviewers are notified by email."); }
    case "ask-accept": S.confirmQuote = el.dataset.id; return render();
    case "cancel-quote": S.confirmQuote = null; return render();
    case "accept-quote": { const q = p.quotes.find(x => x.id === el.dataset.id); q.status = "Accepted"; S.confirmQuote = null;
      p.activity.unshift({ user: me(), text: `accepted quote <b>${q.id} v${q.ver}</b>`, when: "Just now" }); return toast(`${q.id} accepted. ${USERS[p.rep].name} has been notified.`); }
    case "banner": p.theme.banner = el.dataset.v; return toast("Project banner updated.");
    case "reset-theme": p.theme = {}; return toast("Project overrides cleared. Using the customer brand kit.");
    case "copy": { const t = el.dataset.text; try { navigator.clipboard.writeText(t).then(() => toast("Copied"), () => toast("Select the text to copy it")); } catch (err) { toast("Select the text to copy it"); } return; }
    case "toast": return toast(el.dataset.msg);
  }
});

$app.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const p = S.view === "project" ? proj() : null, kind = f.dataset.form;
  if (kind === "login") return go({ view: "projects", role: "brand" });
  if (kind === "register") {
    const o = OPPS.find(x => x.id === S.modal.opp), t = TEMPLATES[S.modal.tpl];
    if (PROJECTS.some(x => x.oppId === o.id)) return toast("That opportunity already has a project.");
    const name = o.name.split(" · ")[0], slug = name.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const bk = "k" + (++seq);
    BRANDS[bk] = { name: t.name === "Blank" ? o.account : t.name, mark: name.split(" ").map(w => w[0]).join("").slice(0, 3), primary: "#2F3B45", secondary: "#B7A58A", font: "Archivo", banner: A("banner-tower.jpg") };
    const np = { id: id("p"), oppId: o.id, slug, brandKey: bk, name, city: o.city, keys: o.keys, stage: "Schematic Design", openingTarget: "TBD", rep: me(), theme: {},
      areas: t.areas.map(a => ({ id: id("a"), name: a[0], qty: "— " + a[1] })), selections: [], samples: [], docs: [], quotes: [], threads: [],
      team: [{ user: me(), role: "Specification consultant", status: "Active" }],
      plan: t.plan.map(st => ({ id: id("g"), name: st[0], steps: st[1].map(x => ({ id: id("k"), t: x, owner: me(), date: "TBD", status: "Not started" })) })),
      welcome: `Welcome to the ${name} flooring workspace. Selections, A&D kits, documents, quotes and our shared plan will all live here.`,
      crm: { Opportunity: o.name, Account: o.account, Amount: o.amount, Stage: "Qualification" }, notes: "",
      activity: [{ user: me(), text: `created the project from the <b>${esc(t.name)}</b> template`, when: "Just now" }] };
    PROJECTS.unshift(np);
    S.modal = null; go({ view: "project", pid: np.id, tab: "branding", thread: "new" });
    return toast(`${name} created from the ${t.name} template. Set the customer's brand, then invite the client team.`);
  }
  if (kind === "decide") {
    const decision = (e.submitter && e.submitter.dataset.decision) || "approve";
    const comment = document.getElementById("decide-comment").value.trim();
    if (decision !== "approve" && !comment) return toast("Add a comment so the team knows what to change.");
    const s = p.selections.find(x => x.id === S.sel), pr = bySku(s.sku);
    s.reviews = s.reviews.filter(r => r.user !== me()).concat({ user: me(), decision, comment, when: "Just now" });
    recompute(s);
    p.activity.unshift({ user: me(), text: `${{ approve: "approved", revise: "requested a revision on", reject: "rejected" }[decision]} <b>${esc(pr.line + " " + pr.name)}</b>`, when: "Just now" });
    return toast(`Decision recorded. Status is now "${STATUS[s.status]}".`);
  }
  if (kind === "sample") {
    const picked = [...f.querySelectorAll("input[name=sample]:checked")].map(i => i.value);
    if (!picked.length && !S.kitDraft.length) return toast("Choose a kit or at least one product.");
    const size = document.getElementById("smp-qty").value;
    const items = [...S.kitDraft.map(k => k === "B" ? "Corporate book & information cards" : `A&D Kit · ${KITS.find(x => x.key === k).name} box`),
      ...picked.map(sid => { const pr = bySku(p.selections.find(x => x.id === sid).sku); return `${pr.line} ${pr.name} · ${size}`; })];
    p.samples.unshift({ id: "SR-" + (10441 + p.samples.length), items, shipTo: document.getElementById("smp-ship").value || USERS[me()].org, by: me(), date: "Just now", status: "Requested" });
    S.sampleDraft = []; S.kitDraft = []; return toast("Sample request submitted. Your consultant will confirm the ship date.");
  }
  if (kind === "add-step") {
    const st = p.plan.find(x => x.id === f.dataset.stage), t = document.getElementById("new-step-" + st.id).value.trim();
    if (!t) return;
    st.steps.push({ id: id("k"), t, owner: me(), date: "TBD", status: "Not started", internal: document.getElementById("new-int-" + st.id).checked });
    return render();
  }
  if (kind === "notes") { p.notes = document.getElementById("internal-notes").value; return toast("Notes saved."); }
  if (kind === "reply") {
    const body = document.getElementById("reply-body").value.trim(), file = document.getElementById("reply-file").files[0];
    if (!body && !file) return;
    const vis = document.getElementById("reply-vis");
    p.threads.find(x => x.id === S.thread).msgs.push({ user: me(), when: "Just now", body, file: file && file.name, internal: !!vis && vis.value === "internal" });
    return render();
  }
  if (kind === "new-thread") {
    const subject = document.getElementById("nt-subject").value.trim(), body = document.getElementById("nt-body").value.trim();
    if (!subject || !body) return toast("Add a subject and a message.");
    const t = { id: id("t"), subject, anchor: document.getElementById("nt-anchor").value || null, msgs: [{ user: me(), when: "Just now", body }] };
    p.threads.unshift(t); S.ntSubject = ""; S.ntAnchor = ""; return go({ thread: t.id });
  }
  if (kind === "invite") {
    const name = document.getElementById("inv-name").value.trim(), email = document.getElementById("inv-email").value.trim(), key = "u" + (++seq);
    USERS[key] = { name, title: "Invited", org: document.getElementById("inv-org").value.trim() || "—", staff: false };
    p.team.push({ user: key, role: document.getElementById("inv-role").value, status: "Invited" });
    return toast(`Invite sent to ${email}.`);
  }
});

$app.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "role-switch") {
    S.role = t.value; S.confirmQuote = null; S.preview = false;
    if (S.view === "project" && !isStaff() && !proj().team.some(m => m.user === me())) S.view = "projects";
    return render();
  }
  if (t.id === "staff-status") { const s = proj().selections.find(x => x.id === S.sel); s.status = t.value; return toast(`Status set to "${STATUS[t.value]}".`); }
  if (t.id === "add-area") { S.modal.area = t.value; return; }
  if (t.id === "reg-opp") { S.modal.opp = t.value; return render(); }
  if (t.name === "tpl") { S.modal.tpl = t.value; return render(); }
  if (t.dataset.pref) { S.prefs[S.role][t.dataset.pref] = t.value; return toast("Notification setting saved."); }
  if (t.dataset.step) { const k = proj().plan.flatMap(x => x.steps).find(x => x.id === t.dataset.step); k.done = t.checked; return render(); }
  if (t.id === "doc-upload") addFiles(t.files);
  if (t.name === "sample") S.sampleDraft = [...document.querySelectorAll("input[name=sample]:checked")].map(i => i.value);
  const kit = S.view === "project" ? BRANDS[proj().brandKey] : null;
  if (t.id === "bk-font") { kit.font = t.value; return render(); }
  if (t.id === "bk-mark") { kit.mark = t.value.trim() || kit.mark; return render(); }
  if (t.id === "bk-logo") return readImage(t.files[0], url => { kit.logo = url; toast("Logo added to the brand kit."); });
  if (t.id === "pj-banner") return readImage(t.files[0], url => { proj().theme.banner = url; toast("Project banner uploaded."); });
});
$app.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "sel-search") { S.f.q = t.value; render(); }
  if (t.id === "add-q") { S.modal.q = t.value; render(); }
  if (t.id === "bk-primary" || t.id === "bk-secondary") {
    const kit = BRANDS[proj().brandKey], prop = t.id === "bk-primary" ? "primary" : "secondary";
    kit[prop] = t.value;
    document.querySelectorAll(".space, .stage-preview").forEach(h => h.style.setProperty("--c-" + prop, t.value));
    t.nextElementSibling.textContent = t.value;
  }
  if (t.id === "tilt") {
    S.tilt = +t.value;
    document.querySelectorAll(".space, .stage-preview").forEach(h => h.style.setProperty("--tilt", (90 + S.tilt) + "deg"));
    document.getElementById("tilt-val").textContent = S.tilt + "°";
  }
});
["dragover", "dragleave", "drop"].forEach(ev => $app.addEventListener(ev, e => {
  const d = e.target.closest && e.target.closest("#drop"); if (!d) return;
  e.preventDefault(); d.classList.toggle("over", ev === "dragover");
  if (ev === "drop") addFiles(e.dataTransfer.files);
}));
function addFiles(files) {
  const p = proj(); if (!files || !files.length) return;
  const cat = S.docCat === "All" ? "Drawings" : S.docCat;
  [...files].forEach(f => p.docs.unshift({ id: id("d"), name: f.name, cat, ver: "v1", size: (f.size / 1048576).toFixed(1) + " MB", by: me(), date: "Just now" }));
  toast(`${files.length} file${files.length > 1 ? "s" : ""} added to ${cat}.`);
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && (S.sel || S.modal)) go({ sel: null, modal: null }); });

/* Deep link: #selections etc. opens the sample project directly. */
(function boot() {
  const h = (location.hash || "").slice(1);
  if (TABS.includes(h)) Object.assign(S, { view: "project", tab: h }, STAFF_TABS.includes(h) ? { role: "rep" } : {});
  else if (h === "projects") S.view = "projects";
  render();
})();
</script>
